name: Scrape gold prices

on:
  schedule:
    # TEST: heartbeat mỗi 1 phút (GitHub có thể delay / throttle)
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-gold
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Scrape prices
        # Manual runs always crawl; scheduled runs respect adaptive nextCrawlAt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/scrape.mjs --force
          else
            node scripts/scrape.mjs
          fi

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/history.json public/data/schedule.json
          if git diff --staged --quiet; then
            echo "No data file changes to commit"
          else
            if git diff --staged --name-only | grep -q 'history.json'; then
              MSG="chore: gold prices changed (adaptive scrape)"
            else
              MSG="chore: gold scrape schedule update"
            fi
            git commit -m "$MSG"
            git push
          fi
