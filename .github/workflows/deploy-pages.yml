name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bot push (GITHUB_TOKEN) không kích hoạt on.push — cần trigger này sau scrape
  workflow_run:
    workflows: ["Scrape gold prices"]
    types: [completed]
    branches: [main]

# Push static site lên branch `gh-pages` (không dùng actions/deploy-pages —
# action đó hay kẹt deployment_queued / Timeout trên GitHub Pages).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
