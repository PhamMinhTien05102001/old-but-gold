name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bot push (GITHUB_TOKEN) không kích hoạt on.push — cần trigger này sau scrape
  workflow_run:
    workflows: ["Scrape gold prices"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false: tránh hủy deploy giữa chừng (dễ thành "Deployment cancelled" / queue treo)
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ fromJSON(steps.deployment.outputs.outputs).page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Pages hay lỗi tạm: deployment_queued timeout / Deployment cancelled / try again later.
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/deploy-pages@v4
          attempt_limit: 4
          attempt_delay: 45000
